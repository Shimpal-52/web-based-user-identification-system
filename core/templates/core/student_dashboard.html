
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard | College ERP</title>
    <style>
        .card {
        display: block;
        text-decoration: none;
        color: #1e293b;
        padding: 22px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        transition: transform 0.2s, box-shadow 0.2s;
}

        .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
}

        .card h3 {
        color: #64748b;
        font-size: 14px;
        font-weight: normal;
}

        .card p {
        font-size: 20px;
        font-weight: bold;
}
    </style>
</head>
<body>
    <header>
        <h1>College ERP — Student Portal</h1>
        <p>Welcome, {{ request.user.username }}</p>
    </header>
    <main>
        <h2>Student Dashboard</h2>
        <p>Your academic information at a glance.</p>
        <section class="cards">
    <a href="{% url 'attendance' %}" class="card">
        <h3>Attendance</h3>
        <p>View records →</p>
    </a>

    <a href="{% url 'results' %}" class="card">
        <h3>Examination Results</h3>
        <p>View marks →</p>
    </a>

    <a href="{% url 'study_materials' %}" class="card">
        <h3>Study Materials</h3>
        <p>View resources →</p>
    </a>
</section>
        <section class="panel">
            
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </section>
    </main>
</body>
</html>
